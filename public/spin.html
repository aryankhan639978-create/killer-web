<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Win - Killer Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-box" style="max-width:400px;">
  <div class="logo-circle">🎰</div>
  <div class="auth-title">SPIN & WIN</div>
  <div class="auth-sub">1 free spin daily</div>
  <div style="text-align:center; padding:20px 0;">
    <div id="wheel" style="width:200px; height:200px; border-radius:50%; background:conic-gradient(#ff0044 0deg 45deg, #ffb700 45deg 90deg, #00ff00 90deg 135deg, #00aaff 135deg 180deg, #ff00ff 180deg 225deg, #ff6b00 225deg 270deg, #ffff00 270deg 315deg, #ff0000 315deg 360deg); border:4px solid #fff; margin:20px auto; display:flex; align-items:center; justify-content:center; font-size:40px; transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);">🎯</div>
    <button id="spinBtn" onclick="doSpin()" style="width:120px; height:120px; border-radius:50%; background:radial-gradient(circle, #ffb700, #ff0044); border:4px solid #fff; color:#fff; font-weight:900; font-size:16px; cursor:pointer; box-shadow:0 0 30px rgba(255,183,0,0.8);">SPIN</button>
    <p id="spinResult" style="color:#ffd700; font-size:16px; font-weight:900; margin-top:15px; min-height:25px;"></p>
  </div>
  <a href="index.html" class="auth-btn" style="display:block; text-align:center; text-decoration:none; margin-top:15px;">← Back to Home</a>
</div>
<div id="toast" class="toast"></div>
<script>
const prizes = ['💎 100 Diamonds','🎁 AK47 Skin','⭐ 5000 Coins','🎟️ Free Token','❌ Better Luck','🎁 MP40 Skin','💎 500 Diamonds','🏆 Grand Prize'];
let spinning = false;
let rotation = 0;
function doSpin() {
  if (spinning) return;
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  btn.textContent = '...';
  const rand = Math.floor(Math.random() * 360);
  rotation += 360 * 5 + rand;
  document.getElementById('wheel').style.transform = 'rotate(' + rotation + 'deg)';
  setTimeout(() => {
    const idx = Math.floor(((360 - rand) % 360) / 45);
    document.getElementById('spinResult').textContent = '🎉 ' + prizes[idx];
    spinning = false;
    btn.disabled = false;
    btn.textContent = 'SPIN AGAIN';
  }, 4200);
}
</script>
</body>
</html>
